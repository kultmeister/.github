name: zeitgeber-probe

# WEGWERF. Einziger Zweck: feuert GitHubs `schedule` in diesem Repo ueberhaupt?
# Kein Checkout, kein Secret, keine Wirkung. Nach dem Urteil wieder entfernen.
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Lebenszeichen
        env:
          ANLASS: ${{ github.event_name }}
        run: echo "zeitgeber-probe · Anlass=$ANLASS · $(date -u +%FT%TZ)"
