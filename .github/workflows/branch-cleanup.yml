# Loescht gemergte Feature-Branches automatisch (Standard ADR-0073).
#
# NACHGEZOGEN 2026-08-29 (KUL-272). Der Workflow lag in 10 von 14 Repos der Org — nicht
# aber dort, wo am meisten gearbeitet wird. Gemessen blieben deshalb sieben gemergte
# Branches liegen: sechs in `ci` (15.-17.08.) und einer in `kultmeister-os`.
#
# Er loescht NUR bei `merged == true`. Ein geschlossener, nicht gemergter PR behaelt
# seinen Branch — nicht gemergte Arbeit wirft man nicht weg. Die uebrigen Reste der
# Flotte sind genau solche Faelle und damit KEIN Befund, sondern das gewollte Verhalten.
name: branch-cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-merged-branch:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const ref = context.payload.pull_request.head.ref;
            const def = context.payload.repository.default_branch;
            if (ref === def) { core.info('Default-Branch wird nicht geloescht.'); return; }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner, repo: context.repo.repo, ref: `heads/${ref}`,
              });
              core.info(`Branch geloescht: ${ref}`);
            } catch (e) {
              core.warning(`Konnte Branch nicht loeschen: ${e.message}`);
            }
